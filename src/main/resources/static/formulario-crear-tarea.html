<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Nueva Tarea</title>
</head>

<body>
    <h1>Crear Tarea</h1>

    <form action="/tareas" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br><br>

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" name="descripcion" rows="3" cols="40"></textarea>
        <br><br>

        <label for="tipo">Tipo:</label>
        <select id="tipo" name="tipo" required>
            <option value="">-- Selecciona un tipo --</option>
            <option value="Construcción">Construcción</option>
            <option value="Minería">Minería</option>
            <option value="Recolección">Recolección</option>
            <option value="Granjas">Granjas</option>
            <option value="Redstone">Redstone</option>
            <option value="Exploración">Exploración</option>
            <option value="Decoración">Decoración</option>
            <option value="Combate">Combate</option>
        </select>
        <br><br>

        <label for="prioridad">Prioridad (1-5):</label>
        <input type="number" id="prioridad" name="prioridad" step="1" min="1" max="5" required>
        <br><br>

        <button type="submit">Crear Tarea</button>
    </form>
</body>

</html>
