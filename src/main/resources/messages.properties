# Mensajes de validacion
tarea.valid.nombre.no_vacio = El nombre de la tarea no puede estar vacío
tarea.valid.nombre.size = El nombre de la tarea no puede superar los 100 caracteres
tarea.valid.descripcion.size = La descripción no puede superar los 255 caracteres
tarea.valid.tipo.no_vacio = El tipo de la tarea no puede estar vacío
tarea.valid.tipo.invalido = El tipo no es válido (Construcción, Minería, Recolección, Granjas, Redstone, Exploración, Decoración o Combate)
tarea.valid.prioridad.min = La prioridad no puede ser inferior a 1
tarea.valid.prioridad.max = La prioridad no puede ser superior a 5